<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DashNet - SMKN 1 Purbalingga Monitor</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <!-- Header -->
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center mb-8 pb-4 border-b border-slate-800 gap-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-sky-400 flex items-center gap-3">
        <i class="fa-solid fa-wifi text-sky-400"></i> DashNet Monitoring
      </h1>
      <p class="text-sm text-slate-400 mt-1">Real-time Network & AP Client Distribution — SMK Negeri 1 Purbalingga</p>
    </div>
    <div class="flex items-center gap-3 text-xs md:text-sm bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
      <span id="status-badge" class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
      <span id="status-text" class="text-slate-300">Syncing...</span>
      <span id="last-update" class="text-slate-500 pl-2 border-l border-slate-700">-</span>
    </div>
  </div>

  <!-- Main Grid -->
  <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Card Summary Total Client -->
    <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl flex items-center justify-between">
      <div>
        <p class="text-slate-400 text-sm font-medium">Total Active Clients</p>
        <h2 id="total-clients" class="text-4xl font-extrabold text-white mt-1">0</h2>
      </div>
      <div class="w-14 h-14 bg-sky-500/10 border border-sky-500/20 text-sky-400 rounded-xl flex items-center justify-center text-2xl">
        <i class="fa-solid fa-users"></i>
      </div>
    </div>

    <!-- Card Summary Total APs -->
    <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl flex items-center justify-between">
      <div>
        <p class="text-slate-400 text-sm font-medium">Active AP / Devices</p>
        <h2 id="total-aps" class="text-4xl font-extrabold text-emerald-400 mt-1">0</h2>
      </div>
      <div class="w-14 h-14 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-xl flex items-center justify-center text-2xl">
        <i class="fa-solid fa-network-wired"></i>
      </div>
    </div>

    <!-- Card Summary Busiest Location -->
    <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl flex items-center justify-between">
      <div>
        <p class="text-slate-400 text-sm font-medium">Busiest AP / Location</p>
        <h2 id="top-ap" class="text-xl font-bold text-amber-400 mt-1 truncate max-w-[200px]">-</h2>
      </div>
      <div class="w-14 h-14 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-xl flex items-center justify-center text-2xl">
        <i class="fa-solid fa-chart-line"></i>
      </div>
    </div>

    <!-- Chart Section (Bar Chart) -->
    <div class="md:col-span-2 bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl">
      <h3 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-chart-bar text-sky-400"></i> Client Distribution per Access Point
      </h3>
      <div class="relative h-[380px]">
        <canvas id="apChart"></canvas>
      </div>
    </div>

    <!-- Data Table Section -->
    <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-col">
      <h3 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-list-ol text-emerald-400"></i> Top AP Load
      </h3>
      <div class="overflow-y-auto max-h-[380px] pr-1">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/50 text-slate-400 uppercase text-xs sticky top-0">
            <tr>
              <th class="p-3">AP / Location</th>
              <th class="p-3 text-right">Clients</th>
            </tr>
          </thead>
          <tbody id="ap-table-body" class="divide-y divide-slate-700/50">
            <tr>
              <td colspan="2" class="text-center p-4 text-slate-500">Loading data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx4Yx18S7GJQUU0WpWfIgVoRPxk-yKKe9MM8HmXN3IjLufLMnNQTQXohdIs4-6h5b1izw/exec';

    let apChartInstance = null;

    async function fetchDashboardData() {
      try {
        const response = await fetch(GAS_URL);
        const json = await response.json();

        if (json && json.data) {
          updateDashboard(json.data);
          document.getElementById('status-badge').className = "inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse";
          document.getElementById('status-text').innerText = "Live";
          document.getElementById('last-update').innerText = new Date().toLocaleTimeString('id-ID');
        }
      } catch (err) {
        console.error('Error fetching data:', err);
        document.getElementById('status-badge').className = "inline-block w-3 h-3 bg-rose-500 rounded-full";
        document.getElementById('status-text').innerText = "Offline / Error";
      }
    }

    function updateDashboard(data) {
      // Urutkan data berdasarkan jumlah Client terbanyak
      data.sort((a, b) => b.ClientCount - a.ClientCount);

      const labels = data.map(item => item.APName);
      const counts = data.map(item => item.ClientCount);

      // Hitung ringkasan
      const totalClients = counts.reduce((acc, curr) => acc + Number(curr), 0);
      const totalAPs = data.length;
      const topAP = data[0] ? `${data[0].APName} (${data[0].ClientCount})` : '-';

      document.getElementById('total-clients').innerText = totalClients.toLocaleString('id-ID');
      document.getElementById('total-aps').innerText = totalAPs;
      document.getElementById('top-ap').innerText = topAP;

      // Update Table
      const tableBody = document.getElementById('ap-table-body');
      tableBody.innerHTML = data.map(item => `
        <tr class="hover:bg-slate-700/30 transition">
          <td class="p-3 font-medium text-slate-200">${item.APName}</td>
          <td class="p-3 text-right font-bold text-sky-400">${item.ClientCount}</td>
        </tr>
      `).join('');

      // Render / Update Chart.js
      const ctx = document.getElementById('apChart').getContext('2d');
      if (apChartInstance) {
        apChartInstance.destroy();
      }

      apChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Active Clients',
            data: counts,
            backgroundColor: 'rgba(56, 189, 248, 0.75)',
            borderColor: '#38bdf8',
            borderWidth: 1,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            x: {
              ticks: { color: '#94a3b8', font: { size: 10 } },
              grid: { display: false }
            },
            y: {
              ticks: { color: '#94a3b8' },
              grid: { color: '#334155' },
              beginAtZero: true
            }
          }
        }
      });
    }

    // Load data awal & interval pembaruan otomatis setiap 30 detik di browser
    fetchDashboardData();
    setInterval(fetchDashboardData, 30000);
  </script>
</body>
</html>
