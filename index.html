<!-- Script Logic -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx4Yx18S7GJQUU0WpWfIgVoRPxk-yKKe9MM8HmXN3IjLufLMnNQTQXohdIs4-6h5b1izw/exec";
        
        let trafficChartInstance = null;
        let apChartInstance = null;

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                
                if (json.status === "success") {
                    setDatabaseStatus(true);
                    updateInventoryTable(json.devices || []);
                    updateTrafficChart(json.traffic || [], json.devices || []);
                    updateVlanCards(json.vlans || []);
                    updateApDistributionChart(json.ap_distribution || []);
                } else {
                    setDatabaseStatus(false, "API Error");
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                setDatabaseStatus(false, "Connection Failed");
            }
        }

        function setDatabaseStatus(isConnected, message = "Database Connected") {
            const badge = document.getElementById('db-status-badge');
            const dot = document.getElementById('db-status-dot');
            const text = document.getElementById('db-status-text');

            if (isConnected) {
                badge.className = "px-3 py-1.5 bg-emerald-500/20 text-emerald-400 text-xs rounded-xl border border-emerald-500/30 flex items-center gap-1.5 font-medium";
                dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                text.innerText = message;
            } else {
                badge.className = "px-3 py-1.5 bg-rose-500/20 text-rose-400 text-xs rounded-xl border border-rose-500/30 flex items-center gap-1.5 font-medium";
                dot.className = "w-2 h-2 rounded-full bg-rose-400";
                text.innerText = message;
            }
        }

        function updateInventoryTable(devices) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (!devices.length) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-500">No registered devices found.</td></tr>`;
                return;
            }

            // Ambil data baris terakhir (terbaru) dari mikrotik
            const latestDev = devices[devices.length - 1];
            const activeClients = parseInt(latestDev.ActiveLeases || latestDev.active_leases || latestDev.ActiveClients || latestDev.active_clients || 969);
            const cpuLoad = latestDev.CpuLoad || latestDev.cpu_load || '0%';

            // Update Statistik di Kartu Atas
            document.getElementById('stat-clients').innerText = activeClients;
            document.getElementById('stat-cpu').innerText = cpuLoad;
            document.getElementById('stat-core-name').innerText = latestDev.DeviceName || 'MikroTik';
            document.getElementById('stat-devices').innerText = `1 / 1`;

            const uniqueDevices = {};
            devices.forEach(d => { uniqueDevices[d.DeviceName] = d; });
            const list = Object.values(uniqueDevices);

            list.forEach(d => {
                const clients = parseInt(d.ActiveLeases || d.active_leases || d.ActiveClients || d.active_clients || activeClients);
                let brandBadge = 'bg-cyan-500/10 text-cyan-400';

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="p-3.5 font-medium text-slate-200">${d.DeviceName || 'CCR2004|SMEGA'}</td>
                        <td class="p-3.5"><span class="px-2 py-0.5 ${brandBadge} rounded-md text-[11px]">MikroTik RouterOS</span></td>
                        <td class="p-3.5 font-mono text-slate-400">192.168.88.1</td>
                        <td class="p-3.5 text-slate-400">Server Room</td>
                        <td class="p-3.5"><span class="px-2 py-0.5 bg-emerald-500/10 text-emerald-400 rounded-md text-[11px] font-semibold">Online</span></td>
                        <td class="p-3.5 text-slate-400 font-mono text-[11px]">${d.Uptime || 'Online'}</td>
                        <td class="p-3.5 font-semibold text-emerald-400">${clients}</td>
                    </tr>
                `;
            });
        }

        function updateTrafficChart(trafficData, deviceData) {
            let chartData = trafficData.filter(t => t.VLANName === "ether1");
            let labels = [];
            let rxValues = [];
            let txValues = [];

            if (chartData.length > 0) {
                labels = chartData.slice(-10).map(t => t.Timestamp ? new Date(t.Timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '');
                rxValues = chartData.slice(-10).map(t => parseFloat(t.RxMbps || 0));
                txValues = chartData.slice(-10).map(t => parseFloat(t.TxMbps || 0));
            } else if (deviceData.length > 0) {
                const recentDevs = deviceData.slice(-10);
                labels = recentDevs.map(d => d.Timestamp ? new Date(d.Timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '');
                rxValues = recentDevs.map(d => parseFloat(d.rx_mbps || 0));
                txValues = recentDevs.map(d => parseFloat(d.tx_mbps || 0));
            }

            let latestRx = rxValues.length ? rxValues[rxValues.length - 1] : 0;
            let latestTx = txValues.length ? txValues[txValues.length - 1] : 0;

            document.getElementById('stat-rx').innerHTML = `<i class="fa-solid fa-arrow-down"></i> ${latestRx.toFixed(1)} Mbps`;
            document.getElementById('stat-tx').innerHTML = `<i class="fa-solid fa-arrow-up"></i> ${latestTx.toFixed(1)} Mbps`;
            document.getElementById('stat-bandwidth-total').innerText = `${(latestRx + latestTx).toFixed(1)} Mbps`;

            const ctx = document.getElementById('trafficChart').getContext('2d');
            if (trafficChartInstance) trafficChartInstance.destroy();

            trafficChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length ? labels : ['--:--'],
                    datasets: [
                        { label: 'Download', data: rxValues.length ? rxValues : [0], borderColor: '#06b6d4', backgroundColor: 'rgba(6, 182, 212, 0.1)', borderWidth: 2, fill: true, tension: 0.3 },
                        { label: 'Upload', data: txValues.length ? txValues : [0], borderColor: '#a855f7', backgroundColor: 'rgba(168, 85, 247, 0.1)', borderWidth: 2, fill: true, tension: 0.3 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { grid: { color: 'rgba(51, 65, 85, 0.3)' }, ticks: { color: '#64748b' } },
                        x: { grid: { display: false }, ticks: { color: '#64748b' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateVlanCards(vlanData) {
            const vlanMap = {};
            vlanData.forEach(item => {
                if (item.VLANName) vlanMap[item.VLANName] = item;
            });

            const container = document.getElementById('vlan-cards-container');
            container.innerHTML = '';

            const keys = Object.keys(vlanMap);
            if (!keys.length) {
                container.innerHTML = `<div class="text-xs text-slate-500 p-2">No active VLAN metrics detected in database.</div>`;
                return;
            }

            keys.forEach(vlanName => {
                const v = vlanMap[vlanName];
                const rx = parseFloat(v.RxMbps || 0).toFixed(1);
                const tx = parseFloat(v.TxMbps || 0).toFixed(1);

                container.innerHTML += `
                    <div class="bg-slate-950/70 border border-slate-800 p-4 rounded-xl flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-semibold text-xs text-cyan-400 font-mono">${vlanName}</span>
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        </div>
                        <div class="space-y-1 text-xs font-mono">
                            <div class="flex justify-between text-slate-400"><span>Rx (Down):</span> <span class="text-cyan-400 font-semibold">${rx} Mbps</span></div>
                            <div class="flex justify-between text-slate-400"><span>Tx (Up):</span> <span class="text-purple-400 font-semibold">${tx} Mbps</span></div>
                        </div>
                    </div>
                `;
            });
        }

        function updateApDistributionChart(apData) {
            const apMap = {};
            apData.forEach(item => {
                if (item.APName) apMap[item.APName] = parseInt(item.ClientCount) || 0;
            });

            const labels = Object.keys(apMap).length ? Object.keys(apMap) : ['No AP Data'];
            const counts = Object.values(apMap).length ? Object.values(apMap) : [0];
            const colors = ['#06b6d4', '#6366f1', '#a855f7', '#ec4899', '#10b981'];

            const ctx = document.getElementById('apChart').getContext('2d');
            if (apChartInstance) apChartInstance.destroy();

            apChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{ data: counts, backgroundColor: colors.slice(0, labels.length), borderWidth: 0 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    cutout: '75%'
                }
            });

            const legendDiv = document.getElementById('ap-legend');
            legendDiv.innerHTML = '';
            labels.forEach((label, idx) => {
                legendDiv.innerHTML += `
                    <div class="flex items-center gap-1.5 truncate">
                        <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${colors[idx % colors.length]}"></span> 
                        <span class="truncate">${label} (${counts[idx]})</span>
                    </div>
                `;
            });
        }

        function filterInventory() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const rows = document.querySelectorAll('#table-body tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        }

        fetchData();
        setInterval(fetchData, 30000);
    </script>
