<!-- Frontend Script Logic -->
    <script>
        // URL Apps Script langsung ditanam di sini
        const API_URL = "https://script.google.com/macros/s/AKfycbx4Yx18S7GJQUU0WpWfIgVoRPxk-yKKe9MM8HmXN3IjLufLMnNQTQXohdIs4-6h5b1izw/exec";
        
        let cpuChartInstance = null;

        async function loadDashboardData() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.status === "success") {
                    updateDashboardUI(result.devices);
                }
            } catch (err) {
                console.error("Failed to fetch data:", err);
                document.getElementById('device-table-body').innerHTML = `<tr><td colspan="7" class="p-6 text-center text-rose-400">Failed to connect to Apps Script API. Check URL or CORS permissions.</td></tr>`;
            }
        }

        function updateDashboardUI(devices) {
            if (!devices || devices.length === 0) return;

            // Stat Cards Update
            document.getElementById('stat-devices').innerText = devices.length;
            const latestDevice = devices[devices.length - 1];
            document.getElementById('stat-clients').innerText = latestDevice.ActiveClients || 0;
            document.getElementById('stat-cpu').innerText = latestDevice.CpuLoad || '0%';

            // Table Update
            const tbody = document.getElementById('device-table-body');
            tbody.innerHTML = '';
            
            // Show latest first
            const reversedDevices = [...devices].reverse();
            document.getElementById('device-count').innerText = `${devices.length} Items`;

            reversedDevices.slice(0, 15).forEach(dev => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-700/30 transition";
                tr.innerHTML = `
                    <td class="p-3 text-xs text-slate-400">${dev.Timestamp ? new Date(dev.Timestamp).toLocaleString() : '-'}</td>
                    <td class="p-3 font-medium text-slate-200">${dev.DeviceName || '-'}</td>
                    <td class="p-3"><span class="px-2 py-0.5 bg-cyan-500/10 text-cyan-400 rounded text-xs">${dev.Type || '-'}</span></td>
                    <td class="p-3"><span class="px-2 py-0.5 bg-emerald-500/10 text-emerald-400 rounded text-xs font-semibold">${dev.Status || 'Online'}</span></td>
                    <td class="p-3 text-amber-400 font-medium">${dev.CpuLoad || '-'}</td>
                    <td class="p-3 text-slate-400 text-xs">${dev.Uptime || '-'}</td>
                    <td class="p-3 font-semibold text-emerald-400">${dev.ActiveClients || 0}</td>
                `;
                tbody.appendChild(tr);
            });

            // Chart Update
            updateCpuChart(devices);
        }

        function updateCpuChart(devices) {
            const chartData = devices.slice(-10); // Last 10 records
            const labels = chartData.map(d => d.Timestamp ? new Date(d.Timestamp).toLocaleTimeString() : '');
            const cpuValues = chartData.map(d => {
                let val = d.CpuLoad ? String(d.CpuLoad).replace('%', '') : '0';
                return parseFloat(val) || 0;
            });

            const ctx = document.getElementById('cpuChart').getContext('2d');
            if (cpuChartInstance) {
                cpuChartInstance.destroy();
            }

            cpuChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'CPU Load (%)',
                        data: cpuValues,
                        borderColor: '#06b6d4',
                        backgroundColor: 'rgba(6, 182, 212, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: { color: 'rgba(51, 65, 85, 0.5)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // Auto load on start & refresh every 30 seconds
        loadDashboardData();
        setInterval(loadDashboardData, 30000);
    </script>
