<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Operation Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col p-6">

    <div class="max-w-7xl mx-auto w-full space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div>
                <h1 class="text-xl font-bold">Network Operation Center</h1>
                <p class="text-xs text-slate-400">MikroTik Real-Time Monitor</p>
            </div>
            <button onclick="fetchData()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 rounded-lg text-xs font-semibold transition">
                <i class="fa-solid fa-rotate mr-1"></i> Refresh Data
            </button>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400 uppercase">Total Records</p>
                <h3 id="stat-records" class="text-2xl font-bold text-cyan-400 mt-1">0</h3>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400 uppercase">Active Clients</p>
                <h3 id="stat-clients" class="text-2xl font-bold text-emerald-400 mt-1">0</h3>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400 uppercase">Latest CPU Load</p>
                <h3 id="stat-cpu" class="text-2xl font-bold text-amber-400 mt-1">0%</h3>
            </div>
        </div>

        <!-- Table Data -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-700 font-semibold text-sm">Devices Log</div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-900/50 text-slate-400 text-xs uppercase border-b border-slate-700">
                        <tr>
                            <th class="p-3">Timestamp</th>
                            <th class="p-3">Device Name</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">CPU Load</th>
                            <th class="p-3">Uptime</th>
                            <th class="p-3">Active Clients</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-700/50 text-slate-300">
                        <tr><td colspan="6" class="p-6 text-center text-slate-400">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx4Yx18S7GJQUU0WpWfIgVoRPxk-yKKe9MM8HmXN3IjLufLMnNQTQXohdIs4-6h5b1izw/exec";

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                
                if (json.status === "success" && json.devices) {
                    const devices = json.devices;
                    document.getElementById('stat-records').innerText = devices.length;
                    
                    if(devices.length > 0) {
                        const latest = devices[devices.length - 1];
                        document.getElementById('stat-clients').innerText = latest.ActiveClients || 0;
                        document.getElementById('stat-cpu').innerText = latest.CpuLoad || '0%';
                    }

                    const tbody = document.getElementById('table-body');
                    tbody.innerHTML = '';
                    
                    [...devices].reverse().forEach(d => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-slate-700/30">
                                <td class="p-3 text-xs text-slate-400">${d.Timestamp ? new Date(d.Timestamp).toLocaleString() : '-'}</td>
                                <td class="p-3 font-medium text-slate-200">${d.DeviceName || '-'}</td>
                                <td class="p-3"><span class="px-2 py-0.5 bg-emerald-500/10 text-emerald-400 rounded text-xs">${d.Status || 'Online'}</span></td>
                                <td class="p-3 text-amber-400">${d.CpuLoad || '-'}</td>
                                <td class="p-3 text-xs text-slate-400">${d.Uptime || '-'}</td>
                                <td class="p-3 font-semibold text-emerald-400">${d.ActiveClients || 0}</td>
                            </tr>
                        `;
                    });
                }
            } catch (err) {
                console.error(err);
                document.getElementById('table-body').innerHTML = `<tr><td colspan="6" class="p-6 text-center text-rose-400">Failed to load data from API.</td></tr>`;
            }
        }

        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
